name: Generate Linux Visual Baselines

on:
  workflow_dispatch:

jobs:
  generate-baselines:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Generate Linux visual snapshots
        run: >
          npx playwright test
          tests/visual/saucedemo/inventory.visual.spec.ts
          --update-snapshots

      - name: Upload Linux snapshots
        uses: actions/upload-artifact@v4
        with:
          name: linux-visual-baselines
          path: tests/visual/saucedemo/inventory.visual.spec.ts-snapshots/*-linux.png
